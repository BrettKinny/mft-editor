[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mft-editor"
version = "0.1.0"
description = "Linux editor for the DJ Tech Tools MIDI Fighter Twister"
requires-python = ">=3.10"
license = "LGPL-3.0-or-later"
authors = [
    { name = "Brett Kinny" },
]
dependencies = [
    "PySide6>=6.5",
    "python-rtmidi>=1.5",
    "mido>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mft-editor = "mft_editor.main:main"

[project.gui-scripts]
mft-editor-gui = "mft_editor.main:main"

[tool.setuptools.packages.find]
where = ["."]
